<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGITAL LIBRARY</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen glass">
  <div class="login-box glass">
    <h2>Library Login</h2>
    <p>Welcome back! Please sign in</p>

    <div id="suggestBox" class="suggest-box"></div>
<p id="loginHint" class="login-hint"></p>

    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />

    <button id="loginBtn">Login</button>

<p style="margin-top:10px;opacity:0.7;">or</p>

<button id="showRegisterBtn" style="background:rgba(255,255,255,0.08);">
  Guest Account
</button>

    
    <div id="registerScreen" class="login-screen glass" style="display:none;">
  <div class="login-box glass">
    <h2>🆕 Guest Account</h2>

    <input id="newUser" placeholder="New username">
    <input id="newPass" type="password" placeholder="New password">

    <button id="createAccountBtn">Create Account</button>

    <button id="backToLogin" style="margin-top:10px;background:rgba(255,255,255,0.08);">
      Back to Login
    </button>

    <p id="registerMsg" style="color:#ef4444;margin-top:10px;"></p>
  </div>
</div>


   

    
  </div>
</div>

<header class="header">
  <div>
    <h1>Library Explorer</h1>
    <p>Search millions of books instantly</p>
  </div>

  <div class="header-actions">
    <button id="themeBtn">🌙</button>
    <button id="favBtn">⭐ <span id="favCount">0</span></button>
    <button class="logout-btn" onclick="logout()">🚪 Logout</button>
  </div>
</header>

<section class="search-box glass">
  <input id="searchInput" placeholder="Search books, authors, topics...">
  <button id="searchBtn">Search</button>

  <div class="chips">
    <button onclick="quickSearch('fantasy')">Fantasy</button>
    <button onclick="quickSearch('science')">Science</button>
    <button onclick="quickSearch('romance')">Romance</button>
    <button onclick="quickSearch('history')">History</button>
  </div>
</section>

<main>
  <div id="loader" class="hidden">Loading...</div>
  <div id="grid" class="grid"></div>
</main>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-content glass">
    <span id="closeModal">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<aside id="favPanel" class="fav-panel hidden glass">

  <div class="fav-header">
    <h3>⭐ Favorites</h3>
    <button id="closeFavBtn">← Back</button>
  </div>

  <div id="favList"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
